name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test ./internal/money -run=^$ -fuzz=FuzzParseDecimal -fuzztime=20s
          go test ./internal/wal -run=^$ -fuzz=FuzzReplay -fuzztime=20s
          go test ./internal/recon -run=^$ -fuzz=FuzzParse -fuzztime=20s
          go test ./internal/api -run=^$ -fuzz=FuzzCreateTransfer -fuzztime=20s
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
